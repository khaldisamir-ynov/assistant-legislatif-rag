# Évaluation complète (31 questions + LLM juge) sur les données du jour : chaque lundi, ou à la main
# (onglet Actions > Évaluation > Run workflow). Pas à chaque push : ~60 appels LLM facturés à l'école.
# L'index chroma_db/ n'est pas dans le dépôt : le pipeline le reconstruit (open data AN + embeddings, ~5 min).
# Secret requis : HF_TOKEN (Settings > Secrets and variables > Actions). MLflow (local) n'est pas joignable
# d'ici : les résultats sont joints au run (evaluation_resultats.json) et résumés sur sa page.
name: Évaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # lundi, 6 h UTC

env:
  LLM_BASE_URL: https://router.huggingface.co/v1
  LLM_API_KEY: ${{ secrets.HF_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  LLM_MODEL: Qwen/Qwen3.8-27B:cerebras
  LLM_JUGE_MODEL: google/gemma-4-31B-it
  LLM_REASONING_EFFORT: none
  HF_BILL_TO: 6acf7e1c0be943d1f0ca6804  # budget étudiant de l'école
  MIN_REUSSIES: 29                      # score de référence du 16/10/2026 (2 échecs connus : « ordre public »)

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Modèle d'embeddings en cache (~1,1 Go, téléchargé une seule fois)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-base
      - name: Index du jour (extraire, transformer, contrôler, stocker)
        run: python pipeline.py
      - name: Évaluation
        run: |
          set -o pipefail
          python evaluate.py --juge --min-reussies "$MIN_REUSSIES" | tee sortie.txt
      - name: Résumé sur la page du run
        if: always()
        run: |
          { echo '```'; grep -E "^(Bilan|Neutralité|Juge|Tokens|ÉCHEC)" sortie.txt || echo "pas de bilan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-resultats
          path: |
            evaluation_resultats.json
            sortie.txt
          if-no-files-found: ignore
